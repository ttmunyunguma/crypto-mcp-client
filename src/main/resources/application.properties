spring.application.name=crypto-mcp-client

# Server Configuration
server.port=8080

# MCP Server Configuration
# Command to start the MCP server (adjust based on your spring-mcp-server setup)
mcp.server.command=java
# Arguments to pass to the server command (point to your MCP server JAR file)
mcp.server.args=-jar,/path/to/spring-mcp-server.jar
# Connection timeout in seconds
mcp.server.timeout=30

# Logging Configuration
logging.level.com.cuius.mcpclient=INFO
logging.level.org.springframework.ai.mcp=DEBUG
