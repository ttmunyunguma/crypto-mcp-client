# Test Configuration for MCP Client
spring.application.name=crypto-mcp-client-test

# Server Configuration for Tests
server.port=0

# MCP Server Configuration for Integration Tests
# Use a mock server command for testing
mcp.server.command=echo
mcp.server.args=test
mcp.server.timeout=5

# Logging Configuration for Tests
logging.level.com.cuius.mcpclient=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.org.springframework.test=DEBUG

# Disable banner in tests
spring.main.banner-mode=off
